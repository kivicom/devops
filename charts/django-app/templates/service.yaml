apiVersion: v1
kind: Service
metadata:
  name: "{{ include "django-app.fullname" . }}"
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  type: "{{ .Values.service.type }}"
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "django-app.selectorLabels" . | nindent 4 }}
